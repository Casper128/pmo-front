# Sitio Netlify de la app React: configurar "Base directory" = react-app (Netlify lee este archivo desde esa carpeta).
# El netlify.toml de la raíz sigue desplegando Angular y no se toca. Variables VITE_* en el sitio (ver README.md).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.15.0"

# SPA: cualquier ruta sirve index.html y React Router resuelve la URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
