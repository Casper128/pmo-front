@if (visible && draft) {
  <app-ui-modal
    [open]="true"
    size="xl"
    eyebrow="Edición rápida"
    title="Editar registro"
    description="Ajusta solo lo necesario antes de enviar."
    (close)="cancel.emit()"
  >
    <span
      modalIcon
      class="grid size-11 shrink-0 place-items-center rounded-xl border border-blue-200 bg-blue-50 text-blue-700"
    >
      <svg
        class="size-5 fill-none stroke-current"
        viewBox="0 0 24 24"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M12 20h9" stroke-linecap="round" />
        <path
          d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <div modalBody class="space-y-4">
      <app-ui-form-section eyebrow="Campos principales" [columns]="4">
        <app-ui-select
          label="Cliente"
          [options]="selectOptions(clientes, 'Seleccione un cliente', draft.cliente)"
          [(ngModel)]="draft.cliente"
          (ngModelChange)="onClienteChange($event)"
        />
        <app-ui-select
          label="Gestión Demanda"
          [options]="solicitudSelectOptions(draft)"
          [searchThreshold]="0"
          searchPlaceholder="Buscar gestión..."
          [disabled]="!draft.cliente"
          [ngModel]="draft.gestionId || draft.solicitud"
          (ngModelChange)="onSolicitudChange($event)"
        />
        <app-ui-select
          label="Tipo hora"
          [options]="selectOptions(tiposHora, undefined, draft.tipoHora)"
          [(ngModel)]="draft.tipoHora"
        />
        <app-ui-date-input label="Fecha" [(ngModel)]="draft.fecha" (ngModelChange)="onFechaChange()" />
        <app-ui-time-input label="Hora inicio" [(ngModel)]="draft.horaIni" (ngModelChange)="calcHoras()" />
        <app-ui-time-input label="Hora fin" [(ngModel)]="draft.horaFin" (ngModelChange)="calcHoras()" />
        <app-ui-field
          label="Horas calculadas"
          tone="emphasis"
          [readonly]="true"
          [ngModel]="draft.horas + ' h'"
        />
      </app-ui-form-section>

      @if (validationErrors.length > 0) {
        <div class="ui-alert ui-alert-error">Revisa: {{ validationErrors.join(', ') }}</div>
      }

      <app-ui-form-section eyebrow="Notas" [columns]="2">
        <app-ui-field label="Descripción" type="textarea" [rows]="2" [(ngModel)]="draft.desc" />
        <app-ui-field
          label="Observación"
          type="textarea"
          [rows]="2"
          [(ngModel)]="draft.observacion"
        />
      </app-ui-form-section>
    </div>

    <div modalFooter class="flex gap-3">
      <button
        class="ui-btn ui-btn-primary flex-1"
        [disabled]="validationErrors.length > 0"
        (click)="onSave()"
      >
        Guardar cambios
      </button>
      <button class="ui-btn ui-btn-secondary flex-1" (click)="cancel.emit()">Cancelar</button>
    </div>
  </app-ui-modal>
}
