<div class="ui-surface">
  <div class="border-b border-slate-100 bg-slate-50 px-4 py-3">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <p class="text-sm font-bold text-slate-900">Pegar tiempos</p>
        <p class="mt-1 text-xs font-semibold text-slate-500">
          Una fecha por bloque y una actividad por línea.
        </p>
      </div>
      <span
        class="rounded-full border border-blue-200 bg-white px-3 py-1 text-[11px] font-bold text-blue-700"
        >Hora - hora | descripción</span
      >
    </div>
  </div>
  <div class="flex flex-col gap-3 p-4">
    <details
      class="rounded-xl border border-slate-200 bg-slate-50 p-3 text-xs leading-relaxed text-slate-500"
    >
      <summary class="cursor-pointer font-bold uppercase tracking-widest text-slate-600">
        Ver ejemplo
      </summary>
      <div class="mt-3 overflow-x-auto rounded-lg bg-white p-3 font-mono text-[12px] shadow-sm">
        <p class="text-slate-800">26/05/2026</p>
        <p>7:30AM-9:00AM | Desarrollo de ajuste FI</p>
        <p>9:30AM-11:00AM | Revisión con usuario</p>
      </div>
    </details>

    <app-ui-field
      label="Pega aquí tus registros de tiempo"
      type="textarea"
      [rows]="8"
      [monospace]="true"
      placeholder="26/05/2026&#10;7:30AM-9:00AM | Descripción de la actividad&#10;9:30AM-11:00AM | Otra actividad"
      hint="Después de procesar podrás completar cliente, gestión y tipo de hora."
      [(ngModel)]="rawText"
    />

    <div class="grid gap-2 sm:grid-cols-[1fr_auto]">
      <button class="ui-btn ui-btn-primary" type="button" (click)="onProcess()">
        Procesar tiempos
      </button>
      <button class="ui-btn ui-btn-secondary" type="button" (click)="clear()">Limpiar</button>
    </div>
  </div>
</div>
