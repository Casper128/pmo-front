<article class="ui-surface flex h-full min-w-0 flex-col p-5">
  <div class="min-w-0">
    <p class="text-[11px] font-bold uppercase tracking-widest text-blue-600">
      {{ eyebrow }}
    </p>
    <h2 class="mt-1 break-words text-lg font-bold text-slate-900">{{ title }}</h2>
    @if (description) {
      <p class="mt-1 break-words text-sm text-slate-500">{{ description }}</p>
    }
  </div>

  <div class="mt-4 min-w-0 flex-1">
    @if (data.length) {
      <app-statistics-chart
        [type]="type"
        [data]="data"
        [ariaLabel]="ariaLabel || title"
        [horizontal]="horizontal"
        [configurable]="configurable"
      />
    } @else {
      <div
        class="grid h-72 place-items-center px-4 text-center text-sm font-bold text-slate-400"
      >
        {{ emptyMessage }}
      </div>
    }
  </div>
  <ng-content select="[chartCardFooter]" />
</article>
