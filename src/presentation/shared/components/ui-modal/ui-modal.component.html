@if (open) {
  <div
    class="ui-modal-backdrop fixed inset-0 z-50 flex items-start justify-center overflow-y-auto p-3 sm:py-8"
    (click)="close.emit()"
  >
    <section
      #dialog
      class="ui-modal-panel w-full"
      [class.ui-modal-panel--sheet]="variant === 'sheet'"
      [class.ui-modal-panel--confirmation]="variant === 'confirmation'"
      [class.ui-modal-panel--destructive]="variant === 'destructive'"
      [class.max-w-lg]="size === 'sm'"
      [class.max-w-3xl]="size === 'md'"
      [class.max-w-5xl]="size === 'lg'"
      [class.max-w-6xl]="size === 'xl'"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="description ? descriptionId : null"
      (click)="$event.stopPropagation()"
      (keydown)="onKeydown($event)"
    >
      <header class="ui-modal-header flex items-start justify-between gap-4 px-5 py-4">
        <div class="flex min-w-0 flex-1 items-start gap-3">
          <ng-content select="[modalIcon]" />
          <div class="min-w-0">
            @if (eyebrow) {
              <p class="ui-eyebrow">{{ eyebrow }}</p>
            }
            <h3 [id]="titleId" class="mt-1 break-words text-xl font-bold text-slate-900">
              {{ title }}
            </h3>
            @if (description) {
              <p [id]="descriptionId" class="mt-1 break-words text-sm font-semibold text-slate-500">
                {{ description }}
              </p>
            }
          </div>
        </div>
        <button
          class="ui-icon-btn shrink-0"
          type="button"
          (click)="close.emit()"
          aria-label="Cerrar"
        >
          <svg
            class="size-4 fill-none stroke-current"
            viewBox="0 0 24 24"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <div class="ui-modal-body max-h-[74vh] overflow-y-auto p-5">
        <ng-content select="[modalBody]" />
      </div>

      <footer class="ui-modal-footer empty:hidden px-5 py-4">
        <ng-content select="[modalFooter]" />
      </footer>
    </section>
  </div>
}
