<header
  class="ui-glass relative overflow-hidden rounded-xl p-5 text-slate-900 sm:p-6"
>
  <div class="flex flex-wrap items-start justify-between gap-5">
    <div class="relative min-w-0 flex-1">
      <p class="text-xs font-extrabold uppercase tracking-[0.12em] text-blue-700">
        {{ eyebrow }}
      </p>
      <h1 class="mt-2 break-words text-2xl font-extrabold tracking-tight sm:text-3xl">
        {{ title }}
      </h1>
      @if (description) {
        <p class="mt-2 max-w-3xl text-sm font-medium leading-6 text-slate-600">
          {{ description }}
        </p>
      }
    </div>

    <div class="relative min-w-0"><ng-content select="[pageHeaderAside]" /></div>
  </div>
  <div class="relative empty:hidden"><ng-content select="[pageHeaderMeta]" /></div>
</header>
